<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARA - Nearby Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fallback / Initial styles to prevent FOUC */
        body {
            font-family: 'Outfit', sans-serif;
            visibility: hidden;
        }
    </style>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.visibility = "visible";
        });
    </script>
</head>

<body>
    <header>
        <h1>LARA</h1>
        <div class="radar"></div>
    </header>

    <main class="main-container">
        <!-- Upload Section -->
        <section class="card">
            <h2 class="section-title">Send Files</h2>
            <div class="drop-zone" id="drop-zone">
                <div class="icon">📤</div>
                <p>Drop files here or click to select</p>
                <input type="file" id="file-input" hidden multiple>
            </div>
            <div class="share-options" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                <label class="switch-container" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="public-share" style="width: 20px; height: 20px;">
                    <span style="font-size: 14px; font-weight: 500;">Create Global Link & QR Code</span>
                </label>

                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 14px; opacity: 0.8;">Expire in:</span>
                    <select id="expires-in"
                        style="background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline); border-radius: 8px; padding: 4px 8px; font-size: 14px;">
                        <option value="1" selected>1 Hour (Default)</option>
                        <option value="5">5 Hours</option>
                        <option value="24">24 Hours</option>
                    </select>
                </div>
            </div>
            <div id="qr-container" class="file-item"
                style="margin-top: 16px; display: none; flex-direction: column; gap: 12px; border-style: dashed;">
                <div style="font-weight: 500; font-size: 14px;">Global Share Active:</div>
                <div id="qrcode" style="align-self: center; padding: 12px; background: white; border-radius: 12px;">
                </div>
                <div style="display: flex; gap: 8px; width: 100%;">
                    <input type="text" id="share-url" readonly
                        style="flex: 1; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline); font-size: 12px;">
                    <button class="btn" onclick="copyShareUrl()" style="padding: 8px 16px;">Copy</button>
                </div>
            </div>
        </section>

        <!-- Discovery Section -->
        <section class="card"
            style="background-color: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container);">
            <h2 class="section-title">Nearby Files</h2>
            <div class="nearby-list" id="nearby-list">
                <!-- Nearby files will appear here -->
                <p style="opacity: 0.7; text-align: center; padding: 20px;">Watching for files in your vicinity...</p>
            </div>
        </section>
    </main>

    <div id="status"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const nearbyList = document.getElementById('nearby-list');
        const statusEl = document.getElementById('status');

        let userCoords = { lat: null, lon: null };

        // Get Location
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                userCoords.lat = pos.coords.latitude;
                userCoords.lon = pos.coords.longitude;
                showStatus("Location pinned for proximity sharing");
            }, err => {
                console.warn("Location denied, falling back to network discovery only");
            });
        }

        function showStatus(msg) {
            statusEl.innerText = msg;
            statusEl.style.display = 'block';
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
        }

        // Upload Logic
        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => handleFiles(e.target.files);

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => dropZone.classList.remove('dragover');

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        async function handleFiles(files) {
            const isPublic = document.getElementById('public-share').checked;
            const expiresIn = document.getElementById('expires-in').value;
            const qrContainer = document.getElementById('qr-container');
            const qrcodeEl = document.getElementById('qrcode');
            const shareUrlInput = document.getElementById('share-url');

            qrContainer.style.display = 'none';
            qrcodeEl.innerHTML = '';

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('is_public', isPublic);
                formData.append('expires_in', expiresIn);

                if (userCoords.lat) {
                    formData.append('lat', userCoords.lat);
                    formData.append('lon', userCoords.lon);
                }

                showStatus(`Sending ${file.name}...`);

                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (res.ok) {
                        showStatus(`Shared ${file.name} successfully!`);

                        if (data.is_public && data.access_token) {
                            const fullUrl = `${window.location.origin}/api/p/${data.access_token}`;
                            shareUrlInput.value = fullUrl;
                            new QRCode(qrcodeEl, {
                                text: fullUrl,
                                width: 160,
                                height: 160,
                                colorDark: "#001e30",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                            qrContainer.style.display = 'flex';
                        }
                    }
                } catch (err) {
                    showStatus("Upload failed!");
                }
            }
        }

        function copyShareUrl() {
            const copyText = document.getElementById("share-url");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            showStatus("Link copied to clipboard!");
        }

        // Discovery Logic
        async function fetchNearby() {
            let url = '/api/discover';
            if (userCoords.lat) {
                url += `?lat=${userCoords.lat}&lon=${userCoords.lon}`;
            }

            try {
                const res = await fetch(url);
                const files = await res.json();

                if (files.length === 0) {
                    nearbyList.innerHTML = '<p style="opacity: 0.7; text-align: center; padding: 20px;">No files found nearby right now.</p>';
                    return;
                }

                nearbyList.innerHTML = '';
                files.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    const size = (f.size / 1024).toFixed(1) + ' KB';
                    div.innerHTML = `
                        <div class="file-info">
                            <span class="file-name">${f.filename}</span>
                            <span class="file-meta">${size} • from ${f.uploader_ip}</span>
                        </div>
                        <button class="btn" onclick="window.open('/api/download/${f.id}')">Receive</button>
                    `;
                    nearbyList.appendChild(div);
                });
            } catch (err) {
                console.error("Discovery error", err);
            }
        }

        // Polling for nearby files
        setInterval(fetchNearby, 3000);
        fetchNearby();
    </script>
</body>

</html>
