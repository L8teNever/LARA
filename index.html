<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARA - Nearby Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fallback / Initial styles to prevent FOUC */
        body {
            font-family: 'Outfit', sans-serif;
            visibility: hidden;
        }
    </style>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.visibility = "visible";
        });
    </script>
</head>

<body>
    <header>
        <h1>LARA</h1>
        <div class="logo">LARA <span>Drop</span></div>
        <nav style="display: flex; gap: 20px;">
            <a href="/" style="text-decoration: none; color: var(--md-sys-color-primary); font-weight: 600;">Home</a>
            <a href="/drop"
                style="text-decoration: none; color: var(--md-sys-color-on-surface); opacity: 0.7; font-weight: 600;">AirDrop
                Mode</a>
        </nav>
    </header>

    <main class="main-container">
        <!-- Preview Modal -->
        <div id="preview-modal"
            style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
            <div class="card"
                style="max-width: 90%; max-height: 90%; background: var(--md-sys-color-surface); padding: 8px; position: relative; display: flex; flex-direction: column; overflow: hidden;">
                <button onclick="closePreview()"
                    style="position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; z-index: 10;">✕</button>
                <div id="preview-content"
                    style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto; min-height: 200px;">
                    <!-- Preview content loaded here -->
                </div>
            </div>
        </div>

        <!-- Upload Section -->
        <section class="card">
            <h2 class="section-title">Send Files</h2>
            <div class="drop-zone" id="drop-zone">
                <div class="icon">📤</div>
                <p>Drop files here or click to select</p>
                <input type="file" id="file-input" hidden multiple>
            </div>
            <div class="share-options" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                <label class="switch-container" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="public-share" style="width: 20px; height: 20px;">
                    <span style="font-size: 14px; font-weight: 500;">Create Global Link & QR Code</span>
                </label>

                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 14px; opacity: 0.8;">Expire in:</span>
                    <select id="expires-in"
                        style="background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline); border-radius: 8px; padding: 4px 8px; font-size: 14px;">
                        <option value="1" selected>1 Hour (Default)</option>
                        <option value="5">5 Hours</option>
                        <option value="24">24 Hours</option>
                    </select>
                </div>
            </div>
            <div id="qr-container" class="file-item"
                style="margin-top: 16px; display: none; flex-direction: column; gap: 12px; border-style: dashed;">
                <div style="font-weight: 500; font-size: 14px;">Global Share Active:</div>
                <div id="qrcode" style="align-self: center; padding: 12px; background: white; border-radius: 12px;">
                </div>
                <div style="display: flex; gap: 8px; width: 100%;">
                    <input type="text" id="share-url" readonly
                        style="flex: 1; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline); font-size: 12px;">
                    <button class="btn" onclick="copyShareUrl()" style="padding: 8px 16px;">Copy</button>
                </div>
            </div>
        </section>

        <!-- Discovery Section -->
        <section class="card"
            style="background-color: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container);">
            <h2 class="section-title">Nearby Files</h2>
            <div class="nearby-list" id="nearby-list">
                <!-- Nearby files will appear here -->
                <p style="opacity: 0.7; text-align: center; padding: 20px;">Watching for files in your vicinity...</p>
            </div>
        </section>
    </main>

    <div id="status"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const nearbyList = document.getElementById('nearby-list');
        const statusEl = document.getElementById('status');

        let userCoords = { lat: null, lon: null };

        // Get Location
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                userCoords.lat = pos.coords.latitude;
                userCoords.lon = pos.coords.longitude;
                showStatus("Location pinned for proximity sharing");
            }, err => {
                console.warn("Location denied, falling back to network discovery only");
            });
        }

        // Check for public token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const publicToken = urlParams.get('token');
        if (publicToken) {
            handlePublicLink(publicToken);
        }

        async function handlePublicLink(token) {
            try {
                const res = await fetch(`/api/p/${token}`);
                if (!res.ok) throw new Error("Link expired or invalid");
                const bundle = await res.json();

                // Show only this bundle in the list
                nearbyList.innerHTML = '<h3 style="font-size: 16px; margin-bottom: 12px;">Public Shared Files:</h3>';
                renderBundle(bundle);
                // Stop regular discovery polling
                window.isPublicMode = true;
            } catch (err) {
                showStatus(err.message);
            }
        }

        function renderBundle(bundle, isExpanded = true) {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.backgroundColor = 'var(--md-sys-color-surface)';
            div.style.color = 'var(--md-sys-color-on-surface)';
            div.style.padding = '16px';
            div.style.marginBottom = '8px';

            const totalSize = (bundle.files.reduce((acc, f) => acc + f.size, 0) / (1024 * 1024)).toFixed(1) + ' MB';
            const fileCount = bundle.files.length;
            const display = isExpanded ? 'flex' : 'none';
            const icon = isExpanded ? '➖' : '➕';
            const timeAgoStr = timeAgo(bundle.timestamp);

            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleBundle('${bundle.id}')">
                    <div class="file-info">
                        <span class="file-name" style="font-weight: 600;">📦 Share from ${bundle.uploader_ip}</span>
                        <span class="file-meta">${fileCount} file(s) • ${totalSize} • ${timeAgoStr}</span>
                    </div>
                    <div style="font-size: 20px;" id="icon-${bundle.id}">${icon}</div>
                </div>
                <div id="bundle-${bundle.id}" style="display: ${display}; margin-top: 16px; border-top: 1px solid var(--md-sys-color-outline); padding-top: 12px; flex-direction: column; gap: 8px;">
                    ${bundle.files.map(f => {
                let downloadUrl = `/api/download/${f.id}`;
                if (userCoords.lat) downloadUrl += `?lat=${userCoords.lat}&lon=${userCoords.lon}`;
                return `
                                    <div class="file-item" style="border: none; background: rgba(0,0,0,0.03); padding: 10px 16px;">
                                        <div class="file-info">
                                            <span class="file-name" style="font-size: 14px;">${f.filename}</span>
                                            <span class="file-meta">${(f.size / 1024).toFixed(1)} KB</span>
                                        </div>
                                        <div style="display: flex; gap: 8px;">
                                            <button class="btn" style="padding: 6px 12px; font-size: 12px; background: var(--md-sys-color-secondary);" onclick="previewFile('${f.id}', '${f.filename}', '${f.content_type}')">Preview</button>
                                            <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="window.open('${downloadUrl}')">Download</button>
                                        </div>
                                    </div>
                                `;
            }).join('')}
                </div>
            `;
            nearbyList.appendChild(div);
        }

        function showStatus(msg) {
            statusEl.innerText = msg;
            statusEl.style.display = 'block';
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
        }

        // Upload Logic
        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => handleFiles(e.target.files);

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => dropZone.classList.remove('dragover');

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        async function handleFiles(files) {
            const isPublic = document.getElementById('public-share').checked;
            const expiresIn = document.getElementById('expires-in').value;
            const qrContainer = document.getElementById('qr-container');
            const qrcodeEl = document.getElementById('qrcode');
            const shareUrlInput = document.getElementById('share-url');

            qrContainer.style.display = 'none';
            qrcodeEl.innerHTML = '';

            // Group all selected files into one formData
            const formData = new FormData();
            for (const file of files) {
                formData.append('files', file);
            }
            formData.append('is_public', isPublic);
            formData.append('expires_in', expiresIn);

            if (userCoords.lat) {
                formData.append('lat', userCoords.lat);
                formData.append('lon', userCoords.lon);
            }

            for (const file of [files[0]]) { // Loop once for the whole bundle

                showStatus(`Sending ${file.name}...`);

                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (res.ok) {
                        showStatus(`Shared ${files.length} file(s) successfully!`);

                        if (data.is_public && data.access_token) {
                            const fullUrl = `${window.location.origin}/?token=${data.access_token}`;
                            shareUrlInput.value = fullUrl;
                            new QRCode(qrcodeEl, {
                                text: fullUrl,
                                width: 160,
                                height: 160,
                                colorDark: "#001e30",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                            qrContainer.style.display = 'flex';
                        }
                    } else {
                        showStatus(`Error: ${data.detail || "Upload failed"}`);
                    }
                } catch (err) {
                    showStatus("Upload failed!");
                }
                break; // Standard multipart upload sends all files at once now
            }
        }

        function copyShareUrl() {
            const copyText = document.getElementById("share-url");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            showStatus("Link copied to clipboard!");
        }

        // Discovery Logic
        async function fetchNearby() {
            if (window.isPublicMode) return;
            let url = '/api/discover';
            if (userCoords.lat) {
                url += `?lat=${userCoords.lat}&lon=${userCoords.lon}`;
            }

            try {
                const res = await fetch(url);
                const files = await res.json();

                if (files.length === 0) {
                    nearbyList.innerHTML = '<p style="opacity: 0.7; text-align: center; padding: 20px;">No shares found nearby right now.</p>';
                    return;
                }

                nearbyList.innerHTML = '';
                files.forEach(bundle => {
                    renderBundle(bundle, false); // Render as collapsed
                });
            } catch (err) {
                console.error("Discovery error", err);
            }
        }

        function toggleBundle(id) {
            const el = document.getElementById(`bundle-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (el.style.display === 'none') {
                el.style.display = 'flex';
                icon.innerText = '➖';
            } else {
                el.style.display = 'none';
                icon.innerText = '➕';
            }
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((new Date() - new Date(timestamp * 1000)) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return 'long ago';
        }

        function previewFile(id, name, type) {
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-content');
            content.innerHTML = '<p style="color: var(--md-sys-color-on-surface)">Loading preview...</p>';
            modal.style.display = 'flex';

            let downloadUrl = `/api/download/${id}`;
            if (userCoords.lat) downloadUrl += `?lat=${userCoords.lat}&lon=${userCoords.lon}`;

            if (type.startsWith('image/')) {
                content.innerHTML = `<img src="${downloadUrl}" style="max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 12px;">`;
            } else if (type.startsWith('video/')) {
                content.innerHTML = `<video src="${downloadUrl}" controls style="max-width: 100%; max-height: 80vh; border-radius: 12px;"></video>`;
            } else if (type === 'application/pdf') {
                content.innerHTML = `<iframe src="${downloadUrl}" style="width: 80vw; height: 80vh; border: none; border-radius: 12px;"></iframe>`;
            } else if (type.startsWith('text/') || type.includes('javascript') || type.includes('json')) {
                fetch(downloadUrl).then(r => r.text()).then(text => {
                    content.innerHTML = `<pre style="padding: 20px; text-align: left; width: 100%; white-space: pre-wrap; font-size: 12px; color: var(--md-sys-color-on-surface); font-family: monospace;">${escapeHtml(text)}</pre>`;
                });
            } else {
                content.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--md-sys-color-on-surface);">
                    <p>No visual preview available for this type.</p>
                    <p style="font-size: 12px; opacity: 0.7;">Type: ${type}</p>
                    <button class="btn" style="margin-top: 16px;" onclick="window.open('${downloadUrl}')">Download Anyway</button>
                </div>`;
            }
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('preview-content').innerHTML = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Polling for nearby files
        setInterval(fetchNearby, 3000);
        fetchNearby();
    </script>
</body>

</html>
